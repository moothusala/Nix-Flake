# mango config, managed by the NixFlake repo (modules/software/_mango/config.conf).
# Edits made here on a machine are overwritten on the next rebuild.
# Reference: https://mangowm.github.io/docs  |  check with: mango -c <file> -p
#
# Noctalia is started by its systemd user service (mango starts
# mango-session.target, which pulls in graphical-session.target), so there
# is no exec-once for it here.

# ---------------------------------------------------------------- Layout
# Scrolling layout on every tag: new windows open as columns to the right,
# and the strip scrolls to keep the focused window on screen.
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
tag_num=9

scroller_structs=20
scroller_default_proportion=0.5
scroller_proportion_preset=0.33,0.5,0.67,1.0
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=1
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0

# ---------------------------------------------------------------- Input
xkb_rules_layout=us
numlockon=1
repeat_rate=25
repeat_delay=600

# Touchpad: two-finger natural scrolling, tap-to-click, clickfinger,
# ignored while typing. Needs a re-login to apply.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_scroll_method=1
trackpad_click_method=2
trackpad_scroll_factor=0.8
trackpad_disable_while_typing=1

# Mouse: flat acceleration, normal wheel direction.
mouse_natural_scrolling=0
mouse_accel_profile=1

sloppyfocus=1
warpcursor=1
focus_on_activate=1
cursor_size=24

# ---------------------------------------------------------------- Appearance
gappih=6
gappiv=6
gappoh=12
gappov=12
borderpx=3
border_radius=10
no_radius_when_single=0
rootcolor=0x201b14ff
bordercolor=0x505050ff
focuscolor=0x7fc8ffff
urgentcolor=0x9b0000ff

# Noctalia recommends no compositor blur/shadows on its layer surfaces.
blur=0
blur_layer=0
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x00000077

animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
tag_animation_direction=0

# Overview
overviewgappi=5
overviewgappo=30

# ---------------------------------------------------------------- Rules
# Floating Noctalia settings window.
windowrule=isfloating:1,width:1080,height:920,appid:dev.noctalia.Noctalia

# ---------------------------------------------------------------- Keybinds
# SUPER is the main modifier.

bind=SUPER,t,spawn,alacritty
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,comma,spawn,noctalia msg settings-toggle
bind=ALT,Tab,spawn,noctalia msg window-switcher hold
bindl=SUPER+ALT,l,spawn,noctalia msg session lock

# Audio, media and brightness keys (also work on the lock screen)
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioStop,spawn,noctalia msg media stop
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

bind=SUPER,o,toggleoverview,
bind=SUPER,q,killclient,
bind=SUPER+CTRL,r,reload_config,
bind=SUPER+SHIFT,e,quit,

# Focus / move within the scrolling strip
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down

# Stack windows into / out of a column
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# Monitors
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# Tags (workspaces)
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# Window sizing
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,v,togglefloating,
bind=SUPER,c,centerwin,

# Screenshots (Noctalia)
bind=NONE,Print,spawn,noctalia msg screenshot-region

# ---------------------------------------------------------------- Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Wheel: SUPER+wheel scrolls between columns, SUPER+SHIFT+wheel switches tags.
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER+SHIFT,UP,viewtoleft_have_client
axisbind=SUPER+SHIFT,DOWN,viewtoright_have_client

# Touchpad gestures: 3-finger left/right scrolls columns, up/down switches
# tags; 4-finger up/down toggles the overview.
gesture_live=1
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,up,3,viewtoright_have_client
gesturebind=none,down,3,viewtoleft_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
